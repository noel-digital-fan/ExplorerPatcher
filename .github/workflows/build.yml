# Explorer Patcher Plus: modified by noel-digital-fan on 2026-11-19; original notices retained.
# Modified 2026-11-21: allow reuse for validation without publishing a release.
# references:
# https://trstringer.com/github-actions-multiline-strings/
# https://trstringer.com/github-actions-create-release-upload-artifacts/
# https://github.com/Speedy37/sws/blob/444c67157a98652c4e7ffd3b6d6bbfb664071926/.github/workflows/msbuild.yml
# https://stackoverflow.com/questions/58886293/getting-current-branch-and-commit-hash-in-github-action

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit'
        required: true
      config:
        description: 'Configuration'
        required: false
      personal_release_id:
        description: 'Existing unpublished personal-install draft ID (owner only; no public release)'
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Exact fork commit to build'
        required: true
        type: string
      release_tag:
        description: 'Fork tag to publish after a successful build'
        required: false
        default: ''
        type: string
      upstream_release_url:
        description: 'Official stable release integrated into this fork build'
        required: false
        default: ''
        type: string

env:
  BUILD_CONFIGURATION: ${{ github.event.inputs.config || 'Release' }}
  BUILD_REF: ${{ inputs.ref || github.event.inputs.ref || github.ref }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  IS_RELEASE: ${{ inputs.release_tag != '' || (github.event_name == 'push' && github.ref_type == 'tag') }}

permissions:
  contents: write

jobs:
  release-automation-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false
      - name: Test release sync without network access
        shell: pwsh
        run: ./.github/scripts/Test-SyncUpstreamRelease.ps1

  build:
    needs: release-automation-checks
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Print inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "ref: ${BUILD_REF}"
          echo "config: ${BUILD_CONFIGURATION}"

      - name: Checkout requested fork commit and submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BUILD_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Declare some variables
        id: vars
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Enable SimpleWindowSwitcher support for newer Windows SDKs
        shell: cmd
        run: |
          cd libs/sws
          C:\msys64\usr\bin\wget.exe https://github.com/valinet/sws/commit/972acb76d1e6429133c92ed7cdefd29b9a2c6179.patch
          C:\msys64\usr\bin\dos2unix.exe 972acb76d1e6429133c92ed7cdefd29b9a2c6179.patch
          C:\msys64\usr\bin\dos2unix.exe SimpleWindowSwitcher/sws_def.h
          C:\msys64\usr\bin\patch.exe -N SimpleWindowSwitcher/sws_def.h 972acb76d1e6429133c92ed7cdefd29b9a2c6179.patch
          C:\msys64\usr\bin\unix2dos.exe SimpleWindowSwitcher/sws_def.h
          exit /b 0

      - name: Setup NuGet
        uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        with:
          nuget-version: '7.x'

      - name: Restore NuGet packages
        run: |
          nuget restore ExplorerPatcher.sln
          nuget restore ep_starttiledata/ep_starttiledata.slnx

      - name: Build dependencies (Debug)
        if: env.BUILD_CONFIGURATION == 'Debug'
        shell: cmd
        run: BuildDependenciesDebug.bat

      - name: Build dependencies (Release)
        if: env.BUILD_CONFIGURATION == 'Release'
        shell: cmd
        run: BuildDependenciesRelease.bat

      - name: Download ep_taskbar
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: ExplorerPatcher/ep_taskbar_releases
          fileName: ep_taskbar.*.dll
          latest: true
          out-file-path: build/Release

      # build/Release/ep_taskbar.*.amd64.dll -> build/Release/x64/ep_taskbar.*.dll
      # build/Release/ep_taskbar.*.arm64.dll -> build/Release/ARM64/ep_taskbar.*.dll
      - name: Move ep_taskbar
        shell: bash
        run: |
          if ls build/Release/ep_taskbar.*.amd64.dll 1> /dev/null 2>&1; then
            mkdir -p build/Release/x64
            for file in build/Release/ep_taskbar.*.amd64.dll; do
              mv "$file" "build/Release/x64/$(basename "$file" .amd64.dll).dll"
            done
          fi

          if ls build/Release/ep_taskbar.*.arm64.dll 1> /dev/null 2>&1; then
            mkdir -p build/Release/ARM64
            for file in build/Release/ep_taskbar.*.arm64.dll; do
              mv "$file" "build/Release/ARM64/$(basename "$file" .arm64.dll).dll"
            done
          fi

      - name: Build ExplorerPatcher
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} build.proj

      - name: Generate dxgi.dll
        shell: bash
        run: |
          if [[ -f "build/Release/x64/ExplorerPatcher.amd64.dll" ]]; then cp build/Release/x64/ExplorerPatcher.amd64.dll build/Release/x64/dxgi.dll; fi
          if [[ -f "build/Release/ARM64/ExplorerPatcher.arm64.dll" ]]; then cp build/Release/ARM64/ExplorerPatcher.arm64.dll build/Release/ARM64/dxgi.dll; fi

      - name: Patch amd64 setup
        shell: cmd
        run: |
          if not exist "build\Release\x64\ExplorerPatcher.amd64.dll" exit /b 1
          "build\Release\x64\ep_setup_patch.exe" "build\Release\x64\ExplorerPatcher.amd64.dll" "build\Release\x64\ep_setup.exe"
          if errorlevel 1 exit /b 1

      - name: Patch arm64 setup
        shell: cmd
        run: |
          if not exist "build\Release\ARM64\ExplorerPatcher.arm64.dll" exit /b 1
          "build\Release\x64\ep_setup_patch.exe" "build\Release\ARM64\ExplorerPatcher.arm64.dll" "build\Release\ARM64\ep_setup.exe"
          if errorlevel 1 exit /b 1

      - name: Verify installer update metadata matches the built DLLs
        shell: pwsh
        run: |
          foreach ($target in @(@('x64', 'amd64'), @('ARM64', 'arm64'))) {
            $directory, $architecture = $target
            $dll = "build/Release/$directory/ExplorerPatcher.$architecture.dll"
            $setup = [IO.File]::ReadAllBytes("$pwd/build/Release/$directory/ep_setup.exe")
            $version = [Diagnostics.FileVersionInfo]::GetVersionInfo("$pwd/$dll")
            $hash = (Get-FileHash $dll -Algorithm MD5).Hash.ToLowerInvariant()
            $expected = "$($version.FileMajorPart).$($version.FileMinorPart).$($version.FileBuildPart).$($version.FilePrivatePart).$hash".Substring(0, 32)
            $actual = [Text.Encoding]::ASCII.GetString($setup, 78, 32)
            if ($setup[0] -ne 0x4d -or $setup[1] -ne 0x5a -or $actual -cne $expected) {
              throw "Installer update metadata is invalid for $architecture."
            }
          }

      - name: Package source, submodules and build-time source patches
        if: env.IS_RELEASE == 'true' && vars.BINARY_REDISTRIBUTION_APPROVED == 'true'
        shell: pwsh
        run: ./.github/scripts/New-SourceArchive.ps1 -Destination build/Release/Explorer-Patcher-Plus-source.zip

      - name: Stage a personal x64 installer in an existing unpublished draft
        if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.personal_release_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PERSONAL_RELEASE_ID: ${{ inputs.personal_release_id }}
          SOURCE_SHA: ${{ steps.vars.outputs.sha }}
        run: |
          if ($env:PERSONAL_RELEASE_ID -notmatch '^[0-9]+$') { throw 'Invalid personal draft ID.' }
          $endpoint = "repos/$env:GH_REPO/releases/$env:PERSONAL_RELEASE_ID"
          $draft = gh api $endpoint | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the personal draft.' }
          if (!$draft.draft -or $draft.published_at -or
              !$draft.tag_name.StartsWith('personal-install-') -or
              $draft.target_commitish -ne $env:SOURCE_SHA) {
            throw 'Personal installers require an existing unpublished personal-install draft targeting this exact source commit.'
          }
          gh release upload $draft.tag_name build/Release/x64/ep_setup.exe --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the personal installer.' }
          $verified = gh api $endpoint | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$verified.draft -or $verified.published_at) {
            throw 'Personal installer draft privacy check failed.'
          }
          Write-Host "Personal installer SHA256: $((Get-FileHash build/Release/x64/ep_setup.exe -Algorithm SHA256).Hash)"

      - name: Delete intermediate files
        shell: bash
        run: |
          rm -rf build/Release/x64/ep_setup_files
          rm -f build/Release/x64/ep_setup_files.zip.bin
          rm -rf build/Release/ARM64/ep_setup_files
          rm -f build/Release/ARM64/ep_setup_files.zip.bin

      - name: Upload artifacts
        if: github.event_name != 'pull_request' && vars.BINARY_REDISTRIBUTION_APPROVED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep_bin_multi_${{ steps.vars.outputs.sha_short }}_${{ github.ref_name }}
          path: |
            build/Release/
          if-no-files-found: error

      # build/Release/x64/ep_setup.exe -> build/Release/ep_setup.exe
      # build/Release/ARM64/ep_setup.exe -> build/Release/ep_setup_arm64.exe
      - name: Stage files for release
        if: env.IS_RELEASE == 'true' && vars.BINARY_REDISTRIBUTION_APPROVED == 'true'
        shell: bash
        run: |
          cp build/Release/x64/ep_setup.exe build/Release/ep_setup.exe
          cp build/Release/ARM64/ep_setup.exe build/Release/ep_setup_arm64.exe

      - name: Generate release name
        shell: bash
        working-directory: build/Release/x64
        if: env.IS_RELEASE == 'true' && vars.BINARY_REDISTRIBUTION_APPROVED == 'true'
        run: |
          echo "data=$(./ep_generate_release_name.exe)" >> $GITHUB_OUTPUT
        id: release_name

      - name: Generate release notes
        shell: bash
        working-directory: build/Release/x64
        if: env.IS_RELEASE == 'true' && vars.BINARY_REDISTRIBUTION_APPROVED == 'true'
        run: |
          echo "data<<EP_RELEASE_DESCRIPTION_DELIM" >> $GITHUB_OUTPUT
          if [[ -n "$UPSTREAM_RELEASE_URL" ]]; then
            echo "Explorer Patcher Plus: custom build from [$GITHUB_REPOSITORY](https://github.com/$GITHUB_REPOSITORY), integrating [the official stable release]($UPSTREAM_RELEASE_URL)." >> "$GITHUB_OUTPUT"
            echo "Existing fork commits, including newer upstream commits already merged, are retained. Updates are served by this fork." >> "$GITHUB_OUTPUT"
            echo >> "$GITHUB_OUTPUT"
          fi
          ./ep_generate_release_description.exe "$STEPS_VARS_OUTPUTS_SHA_SHORT" commit "$SOURCE_SHA" "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_OUTPUT"
          echo "EP_RELEASE_DESCRIPTION_DELIM" >> $GITHUB_OUTPUT
        id: release_description
        env:
          STEPS_VARS_OUTPUTS_SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
          SOURCE_SHA: ${{ steps.vars.outputs.sha }}
          UPSTREAM_RELEASE_URL: ${{ inputs.upstream_release_url }}

      - name: Create/update release (valinet)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        if: github.repository_owner == 'valinet' && github.event_name == 'push' && github.ref_type == 'tag' && vars.BINARY_REDISTRIBUTION_APPROVED == 'true'
        id: create_release
        with:
          draft: false
          prerelease: ${{ !startsWith(github.event.head_commit.message, 'rel_') }}
          name: ${{ steps.release_name.outputs.data }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.release_description.outputs.data }}
          files: |
            build/Release/ep_setup.exe
            build/Release/ep_setup_arm64.exe
          token: ${{ secrets.PAT }}

      - name: Create or verify the immutable fork release tag
        if: github.repository_owner != 'valinet' && env.IS_RELEASE == 'true' && vars.BINARY_REDISTRIBUTION_APPROVED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.vars.outputs.sha }}
        run: |
          $ref = "refs/tags/$env:RELEASE_TAG"
          git check-ref-format $ref
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag.' }
          $existing = git ls-remote --refs origin $ref
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing release tags.' }
          if ($existing) {
            $encodedTag = [uri]::EscapeDataString($env:RELEASE_TAG)
            $commit = gh api "repos/$env:GH_REPO/commits/$encodedTag" --jq '.sha'
            if ($LASTEXITCODE -ne 0 -or $commit -ne $env:SOURCE_SHA) { throw 'Existing tag points at different source.' }
          } else {
            @{ ref = $ref; sha = $env:SOURCE_SHA } | ConvertTo-Json | gh api --method POST "repos/$env:GH_REPO/git/refs" --input -
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the fork release tag.' }
          }

      - name: Create/update release (forks)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        if: github.repository_owner != 'valinet' && env.IS_RELEASE == 'true' && vars.BINARY_REDISTRIBUTION_APPROVED == 'true'
        id: create_release_fork
        with:
          draft: true
          prerelease: ${{ inputs.release_tag == '' && !startsWith(github.event.head_commit.message, 'rel_') }}
          name: ${{ steps.release_name.outputs.data }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.vars.outputs.sha }}
          body: ${{ steps.release_description.outputs.data }}
          fail_on_unmatched_files: true
          files: |
            build/Release/ep_setup.exe
            build/Release/ep_setup_arm64.exe
            build/Release/Explorer-Patcher-Plus-source.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish fork release after both installers are uploaded
        if: github.repository_owner != 'valinet' && env.IS_RELEASE == 'true' && vars.BINARY_REDISTRIBUTION_APPROVED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.create_release_fork.outputs.id }}
          SOURCE_SHA: ${{ steps.vars.outputs.sha }}
          IS_PRERELEASE: ${{ inputs.release_tag == '' && !startsWith(github.event.head_commit.message, 'rel_') }}
        run: |
          $release = gh api "repos/$env:GH_REPO/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the draft release.' }
          foreach ($name in 'ep_setup.exe', 'ep_setup_arm64.exe', 'Explorer-Patcher-Plus-source.zip') {
            $asset = @($release.assets | Where-Object { $_.name -eq $name -and $_.size -gt 0 })
            if ($asset.Count -ne 1) { throw "Missing release installer: $name" }
          }
          $tag = gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $tag -ne $env:SOURCE_SHA) {
            throw 'The release tag does not match the source commit that was built.'
          }
          $prerelease = $env:IS_PRERELEASE -eq 'true'
          $body = @{ draft = $false; prerelease = $prerelease; make_latest = $(if ($prerelease) { 'false' } else { 'true' }) } | ConvertTo-Json
          $body | gh api --method PATCH "repos/$env:GH_REPO/releases/$env:RELEASE_ID" --input -
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed fork release.' }
