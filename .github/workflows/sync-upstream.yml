name: Sync upstream master

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Fast-forward master from upstream
        run: |
          git remote add upstream https://github.com/valinet/ExplorerPatcher.git
          git fetch upstream master
          git merge --ff-only upstream/master
          git push origin master
