# Explorer Patcher Plus: modified by noel-digital-fan on 2026-11-19; original notices retained.
# Modified 2026-11-21: validate synced source while binary publication is disabled.
name: Sync official stable release

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-stable-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'noel-digital-fan/ExplorerPatcher'
    runs-on: ubuntu-latest
    outputs:
      release_required: ${{ steps.sync.outputs.release_required }}
      source_changed: ${{ steps.sync.outputs.source_changed }}
      ref: ${{ steps.sync.outputs.ref }}
      release_tag: ${{ steps.sync.outputs.release_tag }}
      upstream_release_url: ${{ steps.sync.outputs.upstream_release_url }}
    steps:
      - name: Check out fork default branch and full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Merge the latest official stable release
        id: sync
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EP_REPOSITORY: ${{ github.repository }}
          EP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./.github/scripts/Sync-UpstreamRelease.ps1 -Repository $env:EP_REPOSITORY -DefaultBranch $env:EP_DEFAULT_BRANCH

  # A push made with GITHUB_TOKEN does not start the push-triggered build.
  # Validate new source even while binary publication is disabled. Manual runs
  # also allow retrying validation; unchanged scheduled checks do not rebuild.
  validate:
    needs: sync
    if: vars.BINARY_REDISTRIBUTION_APPROVED != 'true' && (needs.sync.outputs.source_changed == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.sync.outputs.source_changed == 'true' && needs.sync.outputs.ref || github.sha }}

  release:
    needs: sync
    if: needs.sync.outputs.release_required == 'true' && vars.BINARY_REDISTRIBUTION_APPROVED == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.sync.outputs.ref }}
      release_tag: ${{ needs.sync.outputs.release_tag }}
      upstream_release_url: ${{ needs.sync.outputs.upstream_release_url }}
